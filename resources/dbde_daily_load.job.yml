# Generated by `python -m dbde render` from every silver and gold spec. Do not edit: change the spec and render again.
# Tasks run on serverless compute. Development mode (dev target) pauses the schedule.
resources:
  jobs:
    dbde_daily_load:
      name: my_databricks_project_daily_load
      description: 'Daily load: source tests, silver notebooks, silver tests, gold
        load procedures, gold tests. Rendered by dbde; do not edit.'
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: 0 0 5 * * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      parameters:
      - name: load_date
        default: ''
      - name: full_refresh
        default: 'false'
      - name: load_step_id
        default: '{{job.run_id}}'
      - name: bronze_catalog
        default: ${var.bronze_catalog}
      - name: silver_catalog
        default: ${var.silver_catalog}
      - name: gold_catalog
        default: ${var.gold_catalog}
      - name: bundle_root
        default: ${workspace.file_path}
      tasks:
      - task_key: test_source
        notebook_task:
          notebook_path: ../notebooks/ops/nb_ops_run_tests.py
          base_parameters:
            layer: source
