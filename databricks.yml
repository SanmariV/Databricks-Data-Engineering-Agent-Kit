# Generated by `python -m dbde render` from dbde.yml. Do not edit: change the spec and render again.
# Workspace hosts and credentials are not here: the CLI profile of each
# target (dbde.yml) or DATABRICKS_HOST / DATABRICKS_CLIENT_ID in CI supply them.
bundle:
  name: my_databricks_project
include:
- resources/*.yml
variables:
  bronze_catalog:
    description: Bronze catalog (read-only).
  silver_catalog:
    description: Silver catalog.
  gold_catalog:
    description: Gold catalog.
  warehouse_id:
    description: SQL warehouse that Genie spaces run on.
  run_as_service_principal:
    description: Application id of the service principal that runs test and prod
      (set by the release pipeline).
    default: ''
targets:
  dev:
    mode: development
    default: true
    variables:
      bronze_catalog: dev_bronze
      silver_catalog: dev_silver
      gold_catalog: dev_gold
      warehouse_id:
        lookup:
          warehouse: TODO(SQL warehouse name)
  test:
    mode: production
    run_as:
      service_principal_name: ${var.run_as_service_principal}
    variables:
      bronze_catalog: test_bronze
      silver_catalog: test_silver
      gold_catalog: test_gold
      warehouse_id:
        lookup:
          warehouse: TODO(SQL warehouse name)
  prod:
    mode: production
    run_as:
      service_principal_name: ${var.run_as_service_principal}
    variables:
      bronze_catalog: prod_bronze
      silver_catalog: prod_silver
      gold_catalog: prod_gold
      warehouse_id:
        lookup:
          warehouse: TODO(SQL warehouse name)
