# Generated by `python -m dbde render` from every silver and gold spec. Do not edit: change the spec and render again.
# Tasks run on serverless compute. Development mode (dev target) pauses the schedule.
resources:
  jobs:
    dbde_daily_load:
      name: insurance_example_daily_load
      description: 'Daily load: source tests, silver notebooks, silver tests, gold
        load procedures, gold tests. Rendered by dbde; do not edit.'
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: 0 0 5 * * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      parameters:
      - name: load_date
        default: ''
      - name: full_refresh
        default: 'false'
      - name: load_step_id
        default: '{{job.run_id}}'
      - name: bronze_catalog
        default: ${var.bronze_catalog}
      - name: silver_catalog
        default: ${var.silver_catalog}
      - name: gold_catalog
        default: ${var.gold_catalog}
      - name: bundle_root
        default: ${workspace.file_path}
      tasks:
      - task_key: test_source
        notebook_task:
          notebook_path: ../notebooks/ops/nb_ops_run_tests.py
          base_parameters:
            layer: source
      - task_key: silver_policy_admin_agent
        depends_on:
        - task_key: test_source
        notebook_task:
          notebook_path: ../notebooks/silver/nb_silver_policy_admin_agent.py
      - task_key: silver_policy_admin_policy
        depends_on:
        - task_key: test_source
        notebook_task:
          notebook_path: ../notebooks/silver/nb_silver_policy_admin_policy.py
      - task_key: silver_sales_new_business_policy
        depends_on:
        - task_key: test_source
        - task_key: silver_policy_admin_policy
        notebook_task:
          notebook_path: ../notebooks/silver/nb_silver_sales_new_business_policy.py
      - task_key: test_silver
        depends_on:
        - task_key: silver_policy_admin_agent
        - task_key: silver_policy_admin_policy
        - task_key: silver_sales_new_business_policy
        notebook_task:
          notebook_path: ../notebooks/ops/nb_ops_run_tests.py
          base_parameters:
            layer: silver
      - task_key: gold_distribution_dim_agent
        depends_on:
        - task_key: test_silver
        notebook_task:
          notebook_path: ../notebooks/ops/nb_ops_load_gold.py
          base_parameters:
            procedure: distribution.LoadDimAgent
      - task_key: gold_sales_fact_new_business
        depends_on:
        - task_key: test_silver
        - task_key: gold_distribution_dim_agent
        notebook_task:
          notebook_path: ../notebooks/ops/nb_ops_load_gold.py
          base_parameters:
            procedure: sales.LoadFactNewBusiness
      - task_key: test_gold
        depends_on:
        - task_key: gold_distribution_dim_agent
        - task_key: gold_sales_fact_new_business
        notebook_task:
          notebook_path: ../notebooks/ops/nb_ops_run_tests.py
          base_parameters:
            layer: gold
